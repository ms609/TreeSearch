# Agent-triggered check — dispatched via `gh` CLI from local agents.
# Runs R CMD check + optional filtered/extended tests on the pushed branch.
# Ubuntu ARM runs first (no vignettes, fast feedback); Windows runs on
# Ubuntu success and includes vignette builds to catch path/encoding issues.
#
# Usage:
#   bash gha-dispatch.sh agent-check.yml <branch>
#   bash gha-dispatch.sh agent-check.yml <branch> test_filter=ts- extended=true

name: agent-check

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "testthat filter (empty = R CMD check only)"
        required: false
        default: ""
      extended:
        description: "Run extended (tier 3) tests"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  ubuntu:
    runs-on: ubuntu-24.04-arm
    name: ubuntu-arm64

    env:
      NOT_CRAN: "true"
      TREESEARCH_EXTENDED_TESTS: ${{ inputs.extended }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # PINNED snapshot, not `latest` -- see the note on R-CMD-check.yml's
      # sense-check leg.  Agents dispatch this workflow constantly, so a stable
      # dependency cache matters more here than fresh dependencies.
      RSPM: "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-30"

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install apt packages
        run: |
          sudo apt-get install -y qpdf

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          # shinytest2=?ignore: its chromote/chromium system requirement makes
          # pak add the ppa:xtradeb/apps PPA and install Chromium on every run
          # (~70 s, not cached).  No Linux leg needs it -- see R-CMD-check.yml.
          # MaxMin isn't on CRAN, so without this pak fetches and compiles it
          # from source on every cache miss (~67 s). This URL is a prebuilt
          # binary for this exact platform/R combo (aarch64, release),
          # published by ms609/packages' build-maxmin workflow -- see the
          # note on R-CMD-check.yml's sense-check leg.
          extra-packages: |
            shinytest2=?ignore
            url::https://ms609.github.io/packages/bin/linux/aarch64-release/MaxMin_latest.tar.gz
          # cache-version bumped to 2: the v1 caches were built while a
          # project-level .Rprofile shadowed ~/.Rprofile, so every package
          # in them was compiled from source.  Retire them once.
          cache-version: 2

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-build-vignettes", "--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-build-vignettes", "--no-manual")'
          error-on: '"error"'

      - name: Run filtered tests
        if: inputs.test_filter != ''
        run: |
          Rscript -e "
            library(testthat)
            library(TreeSearch)
            test_dir('tests/testthat',
                     filter = '${{ inputs.test_filter }}',
                     reporter = 'progress',
                     stop_on_failure = TRUE)
          "
        shell: bash

  windows:
    needs: ubuntu
    runs-on: windows-latest
    name: windows

    env:
      NOT_CRAN: "true"
      TREESEARCH_EXTENDED_TESTS: ${{ inputs.extended }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          # cache-version bumped to 2: the v1 caches were built while a
          # project-level .Rprofile shadowed ~/.Rprofile, so every package
          # in them was compiled from source.  Retire them once.
          cache-version: 2

      - name: R CMD check (with vignettes)
        uses: r-lib/actions/check-r-package@v2

      - name: Run filtered tests
        if: inputs.test_filter != ''
        run: |
          Rscript -e "
            library(testthat)
            library(TreeSearch)
            test_dir('tests/testthat',
                     filter = '${{ inputs.test_filter }}',
                     reporter = 'progress',
                     stop_on_failure = TRUE)
          "
        shell: bash
